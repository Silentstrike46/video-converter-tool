default_install_hook_types: [pre-commit, pre-push]
# Hooks without their own stages run on commit only, not again on push.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  # Tools run through uv so their versions come from uv.lock. --locked
  # fails on a stale uv.lock instead of silently rewriting it.
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      # Legacy CLI is also excluded via force-exclude in [tool.ruff].
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
        files: ^(src|tests)/

      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]
        files: ^(src|tests)/

      # Python files under src/ and tests/, plus pyproject.toml (type
      # checker config) and uv.lock (dependency changes can change types).
      - id: basedpyright
        name: basedpyright
        entry: uv run --locked basedpyright
        language: system
        pass_filenames: false
        files: ^((src|tests)/.*\.pyi?|pyproject\.toml|uv\.lock)$

      - id: pytest
        name: pytest
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
