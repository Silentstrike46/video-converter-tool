[project]
name = "video-converter-tool"
version = "0.1.0"
description = "GUI and CLI wrapper for FFmpeg to convert videos and merge images into video."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = ["easygui>=0.98.3", "ffmpeg-python>=0.2.0"]

[dependency-groups]
dev = [
    "bandit>=1.8.3",
    "black>=25.1.0",
    "flake8>=7.1.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vct"
