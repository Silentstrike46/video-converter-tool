[project]
name = "video-converter-tool"
version = "0.1.0"
description = "GUI and CLI wrapper for FFmpeg to convert videos and merge images into video."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = ["easygui>=0.98.3", "ffmpeg-python>=0.2.0"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vct"

[tool.ruff]
target-version = "py314"
# Explicitly exclude the frozen legacy CLI since it will be
# removed later. Not worth bringing it up to standard before
# it is deleted.
# Remove this exclusion when the legacy CLI is deleted (item 8)
# in the plan.
extend-exclude = ["utils/", "./cli.py"]
force-exclude = true

[tool.ruff.lint]
extend-select = ["S", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # pytest relies on assert

[tool.basedpyright]
# Legacy CLI excluded until it is removed from the project (item 8)
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "recommended"
